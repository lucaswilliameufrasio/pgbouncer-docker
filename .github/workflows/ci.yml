name: CI

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate entrypoint syntax
        run: bash -n docker-entrypoint.sh

      - name: Validate VERSION format
        run: |
          V=$(cat VERSION)
          if ! echo "$V" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "error: VERSION must be semver (e.g. 1.25.2)"
            exit 1
          fi

      - name: Verify version consistency across files
        run: |
          V=$(cat VERSION)
          for f in Dockerfile Dockerfile.alpine; do
            if ! grep -q "PGBOUNCER_VERSION=$V" "$f"; then
              echo "error: $f does not contain PGBOUNCER_VERSION=$V"
              exit 1
            fi
          done

  build:
    name: ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Debian
            file: Dockerfile
            tag: pgbouncer:ci
            arch: amd64
            runner: ubuntu-24.04
          - variant: Alpine
            file: Dockerfile.alpine
            tag: pgbouncer:ci-alpine
            arch: amd64
            runner: ubuntu-24.04
          - variant: Debian
            file: Dockerfile
            tag: pgbouncer:ci-arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: Alpine
            file: Dockerfile.alpine
            tag: pgbouncer:ci-alpine-arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Verify version
        run: |
          VERSION=$(cat VERSION)
          OUTPUT=$(docker run --rm ${{ matrix.tag }} pgbouncer --version 2>/dev/null)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "PgBouncer $VERSION"; then
            echo "error: version mismatch"
            exit 1
          fi

      - name: Verify non-root user
        run: |
          UID_CHECK=$(docker run --rm ${{ matrix.tag }} id -u 2>/dev/null)
          if [ "$UID_CHECK" != "1000" ]; then
            echo "error: expected UID 1000, got $UID_CHECK"
            exit 1
          fi

      - name: Verify file permissions
        run: |
          STATS=$(docker run --rm -e POSTGRESQL_HOST=localhost ${{ matrix.tag }} \
            bash -c 'stat -c "%a %n" /etc/pgbouncer/pgbouncer.ini /etc/pgbouncer/userlist.txt' 2>/dev/null)
          echo "$STATS"
          for p in 600; do
            if ! echo "$STATS" | grep -q "^$p "; then
              echo "error: expected $p permissions"
              exit 1
            fi
          done

      - name: Integration test with PostgreSQL
        run: |
          NET="pgb-ci-${{ github.run_id }}-${{ strategy.job-index }}"
          PG="pg-ci-${{ strategy.job-index }}"
          PB="pb-ci-${{ strategy.job-index }}"

          cleanup() {
            docker rm -f "$PG" "$PB" 2>/dev/null || true
            docker network rm "$NET" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker network create "$NET"

          docker run -d --name "$PG" --network "$NET" \
            -e POSTGRES_USER=appuser -e POSTGRES_PASSWORD=apppass -e POSTGRES_DB=appdb \
            postgres:18-alpine

          until docker exec "$PG" pg_isready -U appuser 2>/dev/null; do sleep 1; done

          docker run -d --name "$PB" --network "$NET" \
            -e DATABASE_URL="postgres://appuser:apppass@$PG:5432/postgres" \
            -e PGBOUNCER_DATABASE_MAP="appdb=appdb" \
            -e PGBOUNCER_ADMIN_PASSWORD=adminpass \
            ${{ matrix.tag }}

          sleep 4

          docker run --rm --network "$NET" -e PGPASSWORD=apppass postgres:18-alpine \
            psql -h "$PB" -p 6432 -U appuser -d appdb -c "SELECT 1 AS test" | grep -q "1"
          echo "CONNECTION OK"

          OUT=$(docker run --rm --network "$NET" -e PGPASSWORD=apppass postgres:18-alpine \
            psql -h "$PB" -p 6432 -U appuser -d pgbouncer -c "SHOW POOLS;" 2>&1 || true)
          if echo "$OUT" | grep -qi "not allowed\|access denied\|not authorized"; then
            echo "ADMIN DENIAL OK"
          else
            echo "ADMIN DENIAL FAIL: $OUT"
            exit 1
          fi

          OUT=$(docker run --rm --network "$NET" -e PGPASSWORD=adminpass postgres:18-alpine \
            psql -h "$PB" -p 6432 -U pgbouncer -d pgbouncer -c "SHOW POOLS;" 2>&1)
          if echo "$OUT" | grep -qi "ERROR:\|access denied"; then
            echo "ADMIN ACCESS FAIL: $OUT"
            exit 1
          fi
          echo "ADMIN ACCESS OK"
