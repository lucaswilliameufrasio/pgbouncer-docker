name: Check Upstream Version

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check for new PgBouncer release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Query latest upstream release
        id: upstream
        run: |
          JSON=$(gh release view --repo pgbouncer/pgbouncer --json tagName,isDraft,isPrerelease 2>/dev/null || \
                 curl -fsSL https://api.github.com/repos/pgbouncer/pgbouncer/releases/latest)

          TAG=$(echo "$JSON" | jq -r '.tagName // .tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "error: could not fetch upstream release"
            exit 1
          fi

          IS_DRAFT=$(echo "$JSON" | jq -r '.isDraft // .draft // false')
          IS_PRERELEASE=$(echo "$JSON" | jq -r '.isPrerelease // .prerelease // false')

          if [ "$IS_DRAFT" = "true" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "Latest release is draft or prerelease, skipping"
            exit 0
          fi

          if ! echo "$TAG" | grep -qP '^pgbouncer_\d+_\d+_\d+$'; then
            echo "error: unexpected tag format: $TAG"
            exit 1
          fi

          VERSION=$(echo "$TAG" | tr '_' '.' | sed 's/^pgbouncer\.//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare with current version
        id: compare
        run: |
          CURRENT=$(cat VERSION)
          NEW="${{ steps.upstream.outputs.version }}"
          if [ "$CURRENT" = "$NEW" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Update version files
        if: steps.compare.outputs.updated == 'true'
        env:
          V: ${{ steps.upstream.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          echo "$V" > VERSION

          SHA_URL="https://github.com/pgbouncer/pgbouncer/releases/download/${TAG}/pgbouncer-${V}.tar.gz"
          SHA256=$(curl -fsSL "$SHA_URL" | sha256sum | cut -d' ' -f1)

          sed -i "s/^ARG PGBOUNCER_VERSION=.*/ARG PGBOUNCER_VERSION=${V}/" Dockerfile
          sed -i "s/^ARG PGBOUNCER_SHA256=.*/ARG PGBOUNCER_SHA256=${SHA256}/" Dockerfile
          sed -i "s/^ARG PGBOUNCER_VERSION=.*/ARG PGBOUNCER_VERSION=${V}/" Dockerfile.alpine
          sed -i "s/^ARG PGBOUNCER_SHA256=.*/ARG PGBOUNCER_SHA256=${SHA256}/" Dockerfile.alpine

      - name: Create pull request
        if: steps.compare.outputs.updated == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump PgBouncer to v${{ steps.upstream.outputs.version }}'
          branch: automation/pgbouncer-update
          title: 'feat: update PgBouncer to v${{ steps.upstream.outputs.version }}'
          body: |
            ## PgBouncer v${{ steps.upstream.outputs.version }}

            Detected [${{ steps.upstream.outputs.tag }}](https://github.com/pgbouncer/pgbouncer/releases/tag/${{ steps.upstream.outputs.tag }}).

            ### Changes
            - Updated `VERSION` to `${{ steps.upstream.outputs.version }}`
            - Updated `Dockerfile` and `Dockerfile.alpine` version and checksum

            ### After merging
            Create the release tag:
            ```bash
            git tag v$(cat VERSION)
            git push origin v$(cat VERSION)
            ```

            > Full CI runs automatically on this PR (dispatched by this workflow).
            > A status comment is posted when it finishes.
          delete-branch: true

      - name: Trigger full CI on the update branch
        if: steps.compare.outputs.updated == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/pgbouncer-update
        run: |
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for i in $(seq 1 12); do
            RUN_ID=$(gh run list --workflow=ci.yml --branch "$BRANCH" --created ">=$SINCE" \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "error: CI run not found after dispatch"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for CI result
        if: steps.compare.outputs.updated == 'true' && steps.dispatch.outputs.run_id != ''
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=${{ steps.dispatch.outputs.run_id }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID"
          if gh run watch "$RUN_ID" --exit-status --interval 15 >/dev/null; then
            RESULT=success
          else
            RESULT=failure
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Report CI status on the PR
        if: steps.compare.outputs.updated == 'true' && steps.ci.outputs.result != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.cpr.outputs.pull-request-number }}
          RUN_URL=${{ steps.ci.outputs.run_url }}
          if [ "${{ steps.ci.outputs.result }}" = "success" ]; then
            gh pr comment "$PR" --body "✅ Full CI passed on this update PR — [run]($RUN_URL)."
          else
            gh pr comment "$PR" --body "❌ Full CI failed on this update PR — [run]($RUN_URL). The upstream update needs attention before merge."
          fi

      - name: Fail on CI failure
        if: steps.compare.outputs.updated == 'true' && steps.ci.outputs.result == 'failure'
        run: exit 1
