name: Test Images
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  test-pull:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker pull ghcr.io/lucaswilliameufrasio/pgbouncer-docker:1.25.2
      - run: docker run --rm ghcr.io/lucaswilliameufrasio/pgbouncer-docker:1.25.2 pgbouncer --version
      - run: docker pull ghcr.io/lucaswilliameufrasio/pgbouncer-docker:alpine
      - run: docker run --rm ghcr.io/lucaswilliameufrasio/pgbouncer-docker:alpine pgbouncer --version
      - run: docker pull ghcr.io/lucaswilliameufrasio/pgbouncer-docker:latest
      - run: docker run --rm ghcr.io/lucaswilliameufrasio/pgbouncer-docker:latest pgbouncer --version
      - run: |
          echo "=== All images verified ==="
          docker images ghcr.io/lucaswilliameufrasio/pgbouncer-docker
