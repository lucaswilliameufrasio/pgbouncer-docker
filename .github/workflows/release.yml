name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (defaults to VERSION)
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag matches VERSION
        id: check
        run: |
          TAG_VERSION="${{ inputs.version }}"
          if [ -z "$TAG_VERSION" ] && [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${{ github.ref_name }}"
          elif [ -z "$TAG_VERSION" ]; then
            TAG_VERSION="$(cat VERSION)"
          fi
          TAG_VERSION="${TAG_VERSION#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "error: tag v$TAG_VERSION != VERSION ($FILE_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Confirm tag belongs to main
        run: |
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "error: tag commit not on main"
            exit 1
          fi

  build-debian-amd64:
    name: Build Debian amd64
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.validate.outputs.version }}-linux-amd64
          build-args: PGBOUNCER_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=Debian-amd64
          cache-to: type=gha,mode=max,scope=Debian-amd64
      - id: ref
        run: echo "ref=${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-debian-arm64:
    name: Build Debian arm64
    needs: [validate]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.validate.outputs.version }}-linux-arm64
          build-args: PGBOUNCER_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=Debian-arm64
          cache-to: type=gha,mode=max,scope=Debian-arm64
      - id: ref
        run: echo "ref=${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-alpine-amd64:
    name: Build Alpine amd64
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: Dockerfile.alpine
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.validate.outputs.version }}-alpine-linux-amd64
          build-args: PGBOUNCER_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=Alpine-amd64
          cache-to: type=gha,mode=max,scope=Alpine-amd64
      - id: ref
        run: echo "ref=${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-alpine-arm64:
    name: Build Alpine arm64
    needs: [validate]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: Dockerfile.alpine
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.validate.outputs.version }}-alpine-linux-arm64
          build-args: PGBOUNCER_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=Alpine-arm64
          cache-to: type=gha,mode=max,scope=Alpine-arm64
      - id: ref
        run: echo "ref=${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  manifest-debian:
    name: Manifest Debian
    needs: [validate, build-debian-amd64, build-debian-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      V: ${{ needs.validate.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          MAJOR=$(echo "$V" | cut -d. -f1)
          MINOR=$(echo "$V" | cut -d. -f1-2)
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:$V \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:$MINOR \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:$MAJOR \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:latest \
            ${{ needs.build-debian-amd64.outputs.ref }} \
            ${{ needs.build-debian-arm64.outputs.ref }}

  manifest-alpine:
    name: Manifest Alpine
    needs: [validate, build-alpine-amd64, build-alpine-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      V: ${{ needs.validate.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          MAJOR=$(echo "$V" | cut -d. -f1)
          MINOR=$(echo "$V" | cut -d. -f1-2)
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:$V-alpine \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:$MINOR-alpine \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:$MAJOR-alpine \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:alpine \
            ${{ needs.build-alpine-amd64.outputs.ref }} \
            ${{ needs.build-alpine-arm64.outputs.ref }}

  sign-and-attest:
    name: Sign and attest images
    needs: [validate, manifest-debian, manifest-alpine]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      V: ${{ needs.validate.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve manifest digests
        id: digest
        run: |
          D=$(docker buildx imagetools inspect "$IMAGE:$V" --format '{{.Manifest.Digest}}')
          echo "debian=$IMAGE@$D" >> "$GITHUB_OUTPUT"
          D=$(docker buildx imagetools inspect "$IMAGE:$V-alpine" --format '{{.Manifest.Digest}}')
          echo "alpine=$IMAGE@$D" >> "$GITHUB_OUTPUT"

      - name: Generate Debian SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:${{ env.V }}
          format: spdx-json
          output-file: sbom-debian.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Alpine SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:${{ env.V }}-alpine
          format: spdx-json
          output-file: sbom-alpine.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images (keyless)
        run: |
          cosign sign --yes "${{ steps.digest.outputs.debian }}"
          cosign sign --yes "${{ steps.digest.outputs.alpine }}"

      - name: Attest SBOMs
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom-debian.spdx.json "${{ steps.digest.outputs.debian }}"
          cosign attest --yes --type spdxjson \
            --predicate sbom-alpine.spdx.json "${{ steps.digest.outputs.alpine }}"

      - name: Self-verify signatures and attestations
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for REF in "${{ steps.digest.outputs.debian }}" "${{ steps.digest.outputs.alpine }}"; do
            echo "verifying $REF"
            cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$REF"
            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$REF"
          done
